services:
  app-029:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-029-refactor-17:latest
    container_name: app-029-refactor-17
    ports:
      - "8269:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
